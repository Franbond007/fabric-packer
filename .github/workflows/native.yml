name: Build native cores

# Builds the native crypto core for Linux and macOS (the Windows packcore.dll is
# built locally with native/build-native.ps1). Download the artifacts from a run
# and drop packcore.so / packcore.dylib into native/ before packing, so the
# packer embeds all three platforms.

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/**'
      - '.github/workflows/native.yml'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: packcore.so
          - os: macos-latest
            artifact: packcore.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build native core
        run: |
          chmod +x native/build-native.sh
          JAVA_HOME="$JAVA_HOME" native/build-native.sh

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: native/${{ matrix.artifact }}
          if-no-files-found: error
